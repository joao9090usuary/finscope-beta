services:
  - type: web
    # Mantido para atualizar o servico existente sem criar uma segunda instancia.
    # A marca exibida pela aplicacao e Revo.
    name: finscope-beta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m jobs.start_web
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: DATABASE_MIGRATIONS_ENABLED
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: BETA_MAX_USERS
        value: "10"
      - key: BETA_INVITE_CODE
        sync: false
      - key: BETA_ALLOWED_EMAILS
        value: ""
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: BRAPI_BASE_URL
        value: https://brapi.dev/api
      - key: BRAPI_TOKEN
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FEEDBACK_TO_EMAIL
        sync: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_COOKIE_SECRET
        sync: false
