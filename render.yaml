services:
  - type: web
    name: finscope-beta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finscope-beta-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DATABASE_MIGRATIONS_ENABLED
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: BETA_MAX_USERS
        value: "10"
      - key: BETA_INVITE_CODE
        sync: false
      - key: BETA_ALLOWED_EMAILS
        value: ""
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: BRAPI_BASE_URL
        value: https://brapi.dev/api
      - key: BRAPI_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: FEEDBACK_TO_EMAIL
        sync: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_COOKIE_SECRET
        sync: false

databases:
  - name: finscope-beta-db
    plan: free
    databaseName: finscope
    user: finscope
    postgresMajorVersion: "17"
    ipAllowList: []
