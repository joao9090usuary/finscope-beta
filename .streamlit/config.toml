[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#08111F"
secondaryBackgroundColor = "#111D30"
codeBackgroundColor = "#0D192A"
textColor = "#F4F7FB"
linkColor = "#60A5FA"
borderColor = "#2A3A50"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["48px", "28px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
linkUnderline = false
greenColor = "#34D399"
redColor = "#FB7185"
yellowColor = "#FBBF24"
blueColor = "#60A5FA"
violetColor = "#8176FF"
chartCategoricalColors = ["#34D399", "#FB7185", "#60A5FA", "#8176FF", "#FBBF24", "#2DD4BF", "#C084FC"]
dataframeBorderColor = "#2A3A50"
dataframeHeaderBackgroundColor = "#111D30"

[theme.sidebar]
backgroundColor = "#091322"
secondaryBackgroundColor = "#111D30"
textColor = "#F4F7FB"
borderColor = "#2A3A50"
